# Katalog mesej Bahasa Melayu (Owner C).
# Peraturan (diuji oleh tests/test_messages.py):
#   - Jangan guna perkataan yang menyatakan selamat, KECUALI ayat penafian
#     "itu tidak bermakna ia selamat" (FR-10).
#   - Label butang (btn.*) maksimum 20 aksara (NFR-UI-02).
#   - Mesej keputusan/amaran maksimum 10 baris dan 700 aksara (NFR-UI-03).
#   - Tiada istilah teknikal: payload, merchant, EMV, TLV, MCC, checksum (NFR-US-04).
#   - Pembolehubah {seperti_ini} dalam en.yaml mesti ada dalam ms.yaml.

# --- Persediaan ---------------------------------------------------------
s.choose_lang: "Semak Dulu 🛡️\nPilih bahasa / Choose language:"
s.welcome: "Hai! Saya Semak Dulu. Saya bantu semak kod QR sebelum anda bayar atau pindahkan wang.\nSaya bukan bank, polis atau agensi kerajaan. Saya hanya beri nasihat.\nAnak: taip DAFTAR untuk sambungkan telefon ibu bapa anda. Saya akan beri satu kod.\nIbu bapa: hantar kod daripada anak anda kepada saya (di telegram gajet ibu bapa).\nLepas itu, forward gambar kod QR kepada saya sebelum melakukan pembayaran."
s.ask_address: "Bagaimana saya patut panggil ibu atau bapa anda? Taip satu perkataan, contoh: Mak, Ayah, Mama."
s.pair_code: "Kod anda: {code}\nBuka chat Semak Dulu di telefon {address_as}, dan hantar kod ini dalam masa 24 jam.\nCadangan: Buat satu kod rahsia keluarga secara bersemuka. Jika ada orang telefon mengaku saudara, minta kod itu untuk pastikan dia betul-betul keluarga. Saya tidak akan sekali-kali bertanya kod itu."
s.code_invalid: "Kod ini tidak boleh digunakan. Minta ahli keluarga anda hantar kod baharu."
s.consent: "Hai {address_as}, saya Semak Dulu. Jika ada orang minta {address_as} bayar guna kod QR, forward gambar QR itu kepada saya dahulu. Saya akan semak tanda-tanda penipuan.\nJika saya nampak tanda penipuan, saya akan terus maklumkan anak {address_as}.\nSaya simpan ID Telegram dan pautan keluarga sahaja. Gambar QR tidak disimpan.\nTaip BERHENTI bila-bila masa untuk padam data."
s.linked_parent: "Terima kasih, {address_as}. Anda sudah dihubungkan dengan anak anda."
s.linked_child: "{address_as} sudah dihubungkan ✅ Saya akan maklumkan anda jika saya nampak unsur-unsur penipuan (scam)."
s.practice_invite: "Jom cuba sekali. Forward mana-mana gambar kod QR kepada saya. Ini latihan sahaja: tiada wang yang dipindahkan dan anak anda tidak akan dimaklumkan."
s.second_code: "Kod untuk ahli keluarga kedua: {code}\nMinta dia hantar kod ini kepada saya dalam masa 24 jam."
s.second_exists: "{address_as} sudah ada ahli keluarga kedua. Hanya seorang dibenarkan."
s.second_invite: "Anda dijemput sebagai ahli keluarga kedua untuk {address_as}. Saya akan maklumkan anda jika anak utama tidak menjawab amaran."
s.second_linked: "Anda kini ahli keluarga kedua untuk {address_as} ✅"
s.second_linked_primary: "Ahli keluarga kedua sudah ditambah untuk {address_as} ✅"
s.not_primary: "Hanya anak yang mendaftar boleh menambah ahli keluarga kedua."
s.lang_changed: "Bahasa ditukar ke Bahasa Melayu."
s.default_address: "anda"

# --- Bantuan dan berhenti ----------------------------------------------
h.help: "Forward gambar kod QR kepada saya sebelum anda bayar.\nArahan:\n1. DAFTAR - anak sambungkan telefon ibu bapa\n2. TAMBAH - tambah ahli keluarga kedua\n3. BAHASA - tukar bahasa\n4. BERHENTI - padam data dan berhenti guna Semak Dulu"
h.stop_confirm: "Anda pasti mahu berhenti? Semua data dan pautan keluarga anda akan dipadam."
h.stopped: "Data anda sudah dipadam. Terima kasih kerana menggunakan Semak Dulu."
h.contact_left: "Seorang ahli keluarga telah berhenti menggunakan Semak Dulu. Pautan dengan anda sudah dipadam."
h.rate_limited: "Terlalu banyak semakan dalam masa singkat. Sila tunggu 10 minit. Jangan bayar dahulu."

# --- Semakan QR ---------------------------------------------------------
q.who_asked: "Terima kasih. Sebelum bayar atau pindahkan wang:\nSiapa yang minta {address_as} bayar?"
q.reminder: "Jangan bayar dahulu. Pilih siapa yang minta bayaran:"
q.expired: "Semakan ini sudah tamat. Sila forward gambar kod QR sekali lagi."

v.stop.official: "🛑 JANGAN BAYAR.\nBank, polis dan mahkamah tidak minta bayaran melalui kod QR.\nLetak telefon sekarang."
