# --- Laporan ------------------------------------------------------------
r.choose_reason: "Kenapa anda mahu laporkan QR ini? Laporan ini hanya dalam Semak Dulu, untuk bantu pengguna lain. Untuk laporan rasmi, hubungi 997.\n1. Pemanggil menyamar sebagai bank, polis, mahkamah atau kurier\n2. Penjual atau orang itu tidak jujur\n3. Lain-lain"
r.thanks: "Terima kasih. Laporan anda membantu orang lain."
r.not_reportable: "Maaf, jenis kod QR ini tidak boleh dilaporkan."
