# Katalog mesej Bahasa Melayu (Owner C).
# PERLU disemak oleh penutur asli BM sebelum demo (NFR-US-07).
# Peraturan (diuji oleh tests/test_messages.py):
#   - Jangan guna perkataan yang menyatakan selamat, KECUALI ayat penafian
#     "itu tidak bermakna ia selamat" (FR-10).
#   - Label butang (btn.*) maksimum 20 aksara (NFR-UI-02).
#   - Mesej keputusan/amaran maksimum 8 baris dan 450 aksara (NFR-UI-03).
#   - Tiada istilah teknikal: payload, merchant, EMV, TLV, MCC, checksum (NFR-US-04).
#   - Pembolehubah {seperti_ini} mesti sama dalam ms.yaml dan en.yaml.

# --- Persediaan ---------------------------------------------------------
s.choose_lang: "Semak Dulu 🛡️\nPilih bahasa / Choose language:"
s.welcome: "Hai! Saya Semak Dulu. Saya bantu semak kod QR sebelum anda bayar.\nSaya bukan bank, polis atau agensi kerajaan. Saya hanya beri nasihat.\nAnak: taip DAFTAR untuk mula. Ibu bapa: hantar kod daripada anak anda, atau forward gambar kod QR kepada saya."
s.ask_address: "Bagaimana saya patut panggil ibu atau bapa anda? Taip satu perkataan, contoh: Mak, Ayah, Mama."
s.pair_code: "Kod anda: {code}\nMinta {address_as} hantar kod ini kepada saya dalam masa 24 jam.\nCadangan: setuju satu kod rahsia keluarga secara bersemuka. Saya tidak akan sekali-kali bertanya kod itu."
s.code_invalid: "Kod ini tidak boleh digunakan. Minta ahli keluarga anda hantar kod baharu."
s.consent: "{address_as}, jika saya nampak tanda penipuan, saya akan terus maklumkan anak {address_as}.\nSaya simpan nombor telefon dan pautan keluarga sahaja. Gambar QR tidak disimpan.\nTaip BERHENTI bila-bila masa untuk padam data."
s.linked_parent: "Terima kasih, {address_as}. Anda sudah dihubungkan dengan anak anda."
s.linked_child: "{address_as} sudah dihubungkan ✅ Saya akan maklumkan anda jika saya nampak tanda penipuan."
s.practice_invite: "Jom cuba sekali. Forward mana-mana gambar kod QR kepada saya. Ini latihan sahaja, tiada wang dihantar."
s.second_code: "Kod untuk ahli keluarga kedua: {code}\nMinta dia hantar kod ini kepada saya dalam masa 24 jam."
s.second_exists: "{address_as} sudah ada ahli keluarga kedua. Hanya seorang dibenarkan."
s.second_invite: "Anda dijemput sebagai ahli keluarga kedua untuk {address_as}. Saya akan maklumkan anda jika anak utama tidak menjawab amaran."
