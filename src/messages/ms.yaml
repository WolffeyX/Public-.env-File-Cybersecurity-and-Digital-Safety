v.verify.courier_unreadable: "🟡 Tunggu dulu, jangan bayar dahulu.\nKami tidak dapat semak kod QR ini.\nSemak bayaran ini dalam aplikasi rasmi syarikat kurier."
v.verify.known_person: "🟡 Tunggu dulu, jangan bayar dahulu.\nNama pada QR: {payee_name}\nJika ahli keluarga: telefon semula guna nombor yang {address_as} sudah simpan, dan tanya kod rahsia keluarga.\nJika kawan/kenalan: telefon dia guna nombor yang {address_as} sudah simpan. Jangan balas dalam chat yang sama, dan jangan guna nombor baru yang dia beri. Akaun kawan mungkin telah digodam.\nJika kedai: pastikan nama kedai sama dengan nama pada QR."
v.told_contact: "Saya sudah maklumkan anak {address_as}. Dia akan telefon sebentar lagi."
